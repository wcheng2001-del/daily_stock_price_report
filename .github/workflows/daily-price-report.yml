name: 每日股票价格报告

on:
  workflow_dispatch:
    inputs:
      stock_list:
        description: "股票代码，以逗号分隔；留空则使用 STOCK_LIST"
        required: false
        type: string
  schedule:
    # 北京时间周一至周五 07:00（UTC 前一天 23:00）
    - cron: '0 23 * * 0,1,2,3,4'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STOCK_LIST: ${{ inputs.stock_list || vars.STOCK_LIST || 'AVGO' }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 生成并寄送价格报告
        run: python stock_price_report.py --send-email
      - name: 保存报告与图表
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-price-reports-${{ github.run_number }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
